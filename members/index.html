<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花の丘 専門家名簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{--ink:#3f3239;--sub:#7a6a72;--paper:#fffcfb;--blush:#fff2f4;--line:#f6dfe5;--sakura:#fcdde5;--sakura-d:#f1b9c8;--rose:#e07b96;--rose-d:#b64768;--leaf:#4c8c6b;--leaf-d:#3a7356;--leaf-l:#eaf4ee;
--h:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--h);font-size:15px;line-height:1.75}
p{margin:0}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}
.head{background:linear-gradient(180deg,var(--sakura),#fff);padding-block:32px 22px}
.head h1{margin:0;font-size:clamp(24px,4.6vw,38px);line-height:1.4;font-weight:900}
.head p{color:var(--sub);margin-top:8px;max-width:38em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,252,251,.96);border-bottom:2px solid var(--sakura-d);backdrop-filter:blur(6px)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:10px}
.count{font-weight:900;font-size:16px}
.count small{font-weight:500;color:var(--sub);margin-left:6px}
.sp{flex:1}
button,.chip{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--leaf);color:#fff;font-weight:900;border:0;border-radius:999px;padding:10px 26px;min-height:44px;box-shadow:0 3px 0 var(--leaf-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-d)}
.btn.g{background:#fff;color:var(--leaf-d);border:2px solid var(--leaf);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding-block:16px 4px}
.chip{border:2px solid var(--sakura-d);background:#fff;border-radius:999px;padding:3px 16px;font-weight:700;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--rose-d);border-color:var(--rose-d);color:#fff}
.list{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-block:18px 60px}
.m{border:2px solid var(--line);border-radius:22px;background:#fff;padding:18px;position:relative}
.m.on{border-color:var(--leaf);box-shadow:0 10px 28px rgba(58,115,86,.14)}
.top{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.ph{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--blush);display:grid;place-items:center;font-weight:900;font-size:26px;color:var(--rose-d)}
.r{font-size:12px;font-weight:700;color:var(--rose-d)}
.nm{font-size:20px;font-weight:900;line-height:1.4;display:block}
.of{font-size:12px;color:var(--sub);line-height:1.5}
.pick{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--leaf-d);cursor:pointer}
.pick input{width:22px;height:22px;accent-color:var(--leaf)}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fl span{background:var(--leaf-l);color:var(--leaf-d);font-weight:700;font-size:12.5px;border-radius:8px;padding:1px 10px}
.fl span.todo{background:#fff3b0;color:#6b5400;border:1px dashed #d9b800}
.msg{margin-top:8px;font-size:14.5px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.meishi{aspect-ratio:91/55;border-radius:6px;border:1px dashed #e6a9bb;background:repeating-linear-gradient(135deg,#fff7f9 0 8px,#fff0f4 8px 16px);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--rose-d);overflow:hidden;position:relative}
.meishi img{width:100%;height:100%;object-fit:cover;display:block}
.meishi.has{border:1px solid #ddd;background:#fff}
.meishi i{position:absolute;left:6px;top:4px;font-style:normal;font-size:10px;font-weight:700;background:#fff;border-radius:4px;padding:0 6px;color:var(--sub)}
/* print sheet */
.sheet{display:none}
@page{size:A4 portrait;margin:10mm}
@media print{
  body{background:#fff;font-size:10pt}
  .ui{display:none!important}
  .sheet{display:block}
  .pg{width:190mm;height:277mm;display:grid;grid-template-rows:repeat(4,69mm);break-after:page;page-break-after:always}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pb{height:69mm;overflow:hidden;border-top:.3mm solid #ccc;padding-top:2mm}
  .pb:first-child{border-top:0;padding-top:0}
  .pt{display:flex;align-items:baseline;gap:3mm;flex-wrap:wrap;height:10mm;overflow:hidden;line-height:1.35}
  .pt b{font-size:13pt;font-weight:900}
  .pt .rr{font-size:8.5pt;color:#555}
  .pt .ff{font-size:8.5pt;font-weight:700;color:#3a7356}
  .pm{font-size:8pt;color:#555;height:4mm;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.3}
  .pc{display:flex;gap:6mm;margin-top:1mm}
  .mc{width:91mm;height:55mm;border:.2mm solid #bbb;display:grid;place-items:center;font-size:8pt;color:#999;overflow:hidden}
  .mc img{width:100%;height:100%;object-fit:cover}
}
@media (max-width:820px){.list{grid-template-columns:1fr}.bar .wrap{gap:8px}.sp{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<main class="wrap">

function roleOf(m){var r=m.role;if(r.indexOf('司法書士')>=0)return '司法書士';if(r.indexOf('行政書士')>=0)return '行政書士';if(r.indexOf('税理士')>=0)return '税理士';return 'その他';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function meishi(src,label){return src?'<div class="meishi has"><i>'+label+'</i><img src="'+esc(src)+'" alt="'+label+'"></div>':'<div class="meishi"><span>名刺（'+label+'）<br>準備中</span></div>';}
function render(){
  var f=document.getElementById('filters');
  f.innerHTML=ROLES.map(function(r){return '<button type="button" class="chip" aria-pressed="'+(r===flt)+'" data-r="'+r+'">'+r+'</button>'}).join('');
  [].forEach.call(f.querySelectorAll('.chip'),function(b){b.onclick=function(){flt=b.getAttribute('data-r');render();};});
  var l=document.getElementById('list');
  l.innerHTML=DATA.filter(function(m){return flt==='すべて'||roleOf(m)===flt}).map(function(m){
    var ph=m.photo?'<img class="ph" src="'+m.photo+'" alt="'+esc(m.name)+'" width="72" height="72">':'<span class="ph" aria-hidden="true">'+esc(m.name.charAt(0))+'</span>';
    var fl=m.fields.length?m.fields.map(function(x){return '<span>'+esc(x)+'</span>'}).join(''):'<span class="todo">得意分野を記入</span>';
    return '<article class="m'+(sel[m.id]?' on':'')+'"><label class="pick"><input type="checkbox" data-id="'+m.id+'"'+(sel[m.id]?' checked':'')+'>印刷に入れる</label>'
     +'<div class="top">'+ph+'<div><span class="r">'+esc(m.role)+'</span><b class="nm">'+esc(m.name)+'</b><span class="of">'+esc(m.office)+'</span></div></div>'
     +'<div class="fl">'+fl+'</div><p class="msg">'+esc(m.msg)+'</p>'
     +'<div class="cards">'+meishi(m.front,'表')+meishi(m.back,'裏')+'</div></article>';
  }).join('');
  [].forEach.call(l.querySelectorAll('input[data-id]'),function(c){c.onchange=function(){sel[c.getAttribute('data-id')]=c.checked;render();};});
  var n=DATA.filter(function(m){return sel[m.id]}).length;
  document.getElementById('count').innerHTML='選択中 '+n+'名<small>A4 '+Math.ceil(n/4)+'枚</small>';
  document.getElementById('print').disabled=n===0;
  buildSheet();
}
function buildSheet(){
  var s=DATA.filter(function(m){return sel[m.id]}),h='';
  function mc(src,l){return '<div class="mc">'+(src?'<img src="'+esc(src)+'" alt="">':'名刺（'+l+'）')+'</div>';}
  for(var i=0;i<s.length;i+=4){
    h+='<div class="pg">'+s.slice(i,i+4).map(function(m){
      return '<div class="pb"><div class="pt"><b>'+esc(m.name)+'</b><span class="rr">'+esc(m.role)+(m.office?'／'+esc(m.office):'')+'</span><span class="ff">'+esc(m.fields.join('・'))+'</span></div><div class="pm">'+esc(m.msg)+'</div><div class="pc">'+mc(m.front,'表')+mc(m.back,'裏')+'</div></div>';
    }).join('')+'</div>';
  }
  document.getElementById('sheet').innerHTML=h;
}
document.getElementById('all').onclick=function(){DATA.forEach(function(m){sel[m.id]=true});render();};
document.getElementById('none').onclick=function(){sel={};render();};
document.getElementById('print').onclick=function(){try{window.print();}catch(e){}};
DATA.slice(0,4).forEach(function(m){sel[m.id]=true});
render();
</script>
</body>
</html>
