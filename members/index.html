<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>花の丘 専門家名簿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{--ink:#3f3239;--sub:#7a6a72;--paper:#fffcfb;--blush:#fff2f4;--line:#f6dfe5;--sakura:#fcdde5;--sakura-d:#f1b9c8;--rose:#e07b96;--rose-d:#b64768;--leaf:#4c8c6b;--leaf-d:#3a7356;--leaf-l:#eaf4ee;
--h:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--h);font-size:15px;line-height:1.75}
p{margin:0}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:20px}
.head{background:linear-gradient(180deg,var(--sakura),#fff);padding-block:32px 22px}
.head h1{margin:0;font-size:clamp(24px,4.6vw,38px);line-height:1.4;font-weight:900}
.head p{color:var(--sub);margin-top:8px;max-width:38em}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(255,252,251,.96);border-bottom:2px solid var(--sakura-d);backdrop-filter:blur(6px)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:10px}
.count{font-weight:900;font-size:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding-block:16px 4px}
.chip{border:2px solid var(--sakura-d);background:#fff;border-radius:999px;padding:3px 16px;font-weight:700;font-size:14px;color:var(--ink);font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--rose-d);border-color:var(--rose-d);color:#fff}
.list{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-block:18px 60px}
.m{border:2px solid var(--line);border-radius:22px;background:#fff;padding:18px}
.top{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.ph{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--blush);display:grid;place-items:center;font-weight:900;font-size:26px;color:var(--rose-d)}
.nm{font-size:20px;font-weight:900;line-height:1.4;display:block}
.of{font-size:12px;color:var(--sub);line-height:1.5}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.fl span{background:var(--leaf-l);color:var(--leaf-d);font-weight:700;font-size:12.5px;border-radius:8px;padding:1px 10px}
.msg{margin-top:8px;font-size:14.5px}
.note{padding-block:40px;text-align:center;color:var(--sub)}
@media (max-width:820px){.list{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="head"><div class="wrap"><h1>花の丘相続・遺言サポート<br>専門家名簿</h1>
<p>相続・遺言・終活などをご相談いただける専門家の一覧です。</p></div></header>
<div class="bar"><div class="wrap">
 <div class="count" id="count" aria-live="polite"></div>
</div></div>
<main class="wrap">
 <div class="filters" id="filters"></div>
 <div class="list" id="list"></div>
</main>
<script src="../config.js"></script>
<script>
var CFG = window.APP_CONFIG || {};
var DATA = [];
var flt = 'すべて';
var ROLES = ['すべて', '司法書士', '行政書士', '税理士', 'その他'];

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function roleOf(m) {
  var t = m.org || '';
  if (t.indexOf('司法書士') >= 0) return '司法書士';
  if (t.indexOf('行政書士') >= 0) return '行政書士';
  if (t.indexOf('税理士') >= 0) return '税理士';
  return 'その他';
}

function render() {
  var f = document.getElementById('filters');
  f.innerHTML = ROLES.map(function (r) { return '<button type="button" class="chip" aria-pressed="' + (r === flt) + '" data-r="' + r + '">' + r + '</button>'; }).join('');
  [].forEach.call(f.querySelectorAll('.chip'), function (b) { b.onclick = function () { flt = b.getAttribute('data-r'); render(); }; });
  var rows = DATA.filter(function (m) { return flt === 'すべて' || roleOf(m) === flt; });
  var l = document.getElementById('list');
  l.innerHTML = rows.length ? rows.map(function (m) {
    var ph = m.photo ? '<img class="ph" src="' + esc(m.photo) + '" alt="' + esc(m.name) + '" width="72" height="72">' : '<span class="ph" aria-hidden="true">' + esc(m.name.charAt(0)) + '</span>';
    var fl = m.tags && m.tags.length ? m.tags.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') : '';
    return '<article class="m"><div class="top">' + ph + '<div><b class="nm">' + esc(m.name) + '</b><span class="of">' + esc(m.org || '') + '</span></div></div>'
      + (fl ? '<div class="fl">' + fl + '</div>' : '') + (m.comment ? '<p class="msg">' + esc(m.comment) + '</p>' : '') + '</article>';
  }).join('') : '<p class="note">該当する専門家がいません。</p>';
  document.getElementById('count').textContent = DATA.length + '名';
}

(async function init() {
  if (!CFG.GAS_URL) { document.getElementById('list').innerHTML = '<p class="note">準備中です。</p>'; return; }
  try {
    var res = await fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'membersPublicList', payload: {} }) });
    var data = await res.json();
    if (!data.ok) throw new Error('failed');
    DATA = data.members || [];
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = '<p class="note">読み込めませんでした。通信状況をご確認のうえ、もう一度開いてください。</p>';
  }
})();
</script>
</body>
</html>
